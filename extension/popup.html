<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing & Spam Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="extension-container">
    <header class="extension-header">
      <div class="logo-group">
        <div class="shield-icon">🛡️</div>
        <div>
          <h1>ML Security Guard</h1>
          <span class="subtext">Phishing & Spam Classifier</span>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tab-url-btn">Scan URL</button>
      <button class="tab-btn" id="tab-email-btn">Scan Text / Email</button>
    </div>

    <!-- URL Scanning View -->
    <div class="tab-content" id="tab-url">
      <div class="input-group">
        <label for="url-input">Target URL:</label>
        <div class="input-with-button">
          <input type="text" id="url-input" placeholder="https://..." />
          <button id="get-current-tab-btn" title="Use current active tab URL">Active Tab</button>
        </div>
      </div>
      <button id="scan-url-btn" class="primary-btn">Analyze URL Risk</button>

      <div id="url-result" class="result-card hidden">
        <div class="verdict-banner" id="url-verdict-banner">
          <span id="url-verdict-icon"></span>
          <div>
            <h2 id="url-verdict-title"></h2>
            <p id="url-verdict-confidence"></p>
          </div>
        </div>
        <div class="metrics-grid">
          <div class="metric-item">
            <span class="metric-label">Risk Score</span>
            <span class="metric-val" id="metric-risk"></span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Entropy</span>
            <span class="metric-val" id="metric-entropy"></span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Subdomains</span>
            <span class="metric-val" id="metric-subdomains"></span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Length</span>
            <span class="metric-val" id="metric-length"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Email / Text Scanning View -->
    <div class="tab-content hidden" id="tab-email">
      <div class="input-group">
        <label for="email-subject-input">Subject Line:</label>
        <input type="text" id="email-subject-input" placeholder="e.g. Urgent account update..." />
      </div>
      <div class="input-group">
        <label for="email-body-input">Email Body / Message:</label>
        <textarea id="email-body-input" rows="4" placeholder="Paste email or message text here..."></textarea>
      </div>
      <button id="scan-email-btn" class="primary-btn">Classify Spam / Phish</button>

      <div id="email-result" class="result-card hidden">
        <div class="verdict-banner" id="email-verdict-banner">
          <span id="email-verdict-icon"></span>
          <div>
            <h2 id="email-verdict-title"></h2>
            <p id="email-verdict-confidence"></p>
          </div>
        </div>
        <div class="signals-list" id="email-signals"></div>
      </div>
    </div>

    <footer class="extension-footer">
      <span>Logistic Regression + Naive Bayes</span>
      <span class="status-dot"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
