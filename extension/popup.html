<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="extension-box">
    <header class="header">
      <h1 class="brand">PhishGuard</h1>
      <hr class="divider" />
    </header>

    <main class="content">
      <div class="website-section">
        <span class="label">Current website:</span>
        <div id="website-domain" class="domain-text">Loading...</div>
      </div>

      <div id="loading-state" class="state-container">
        <div class="spinner"></div>
        <p class="status-msg">Inspecting URL with trained model...</p>
      </div>

      <div id="result-state" class="state-container hidden">
        <div id="verdict-tag" class="verdict"></div>
        
        <div class="confidence-box">
          <span class="confidence-label">Confidence:</span>
          <span id="confidence-value" class="confidence-value"></span>
        </div>

        <p id="explanation-text" class="explanation"></p>
      </div>

      <div id="error-state" class="state-container hidden">
        <p id="error-text" class="error-msg"></p>
      </div>

      <button id="scan-again-btn" class="scan-btn">Scan Again</button>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
